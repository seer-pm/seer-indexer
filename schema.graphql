enum MarketType {
  Generic
  Futarchy
}

type Market {
  id: ID!
  chainId: BigInt!
  address: Bytes!
  marketQuestionIds: [String!]!
  marketType: MarketType!
  factory: Bytes!
  creator: Bytes!
  marketName: String!
  outcomes: [String!]!
  outcomesSupply: BigInt!
  lowerBound: BigInt!
  upperBound: BigInt!
  parentCollectionId: Bytes!
  parentOutcome: BigInt!
  parentMarket: Market
  childMarkets: [Market!]! @derivedFrom(field: "parentMarket")
  wrappedTokens: [Bytes!]!
  collateralToken: Bytes!
  collateralToken1: Bytes!
  collateralToken2: Bytes!
  conditionId: Bytes!
  ctfCondition: Condition!
  questionId: Bytes!
  templateId: BigInt!
  encodedQuestions: [String!]!
  payoutReported: Boolean!
  payoutNumerators: [BigInt!]!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  updatedAt: BigInt!
  transactionHash: Bytes!
  questions: [MarketQuestion!]! @derivedFrom(field: "market")
  openingTs: BigInt!
  hasAnswers: Boolean!
  finalizeTs: BigInt!
  questionsInArbitration: BigInt!
  index: BigInt!
}

type MarketsCount {
  id: ID!
  count: BigInt!
}

type Question {
  id: ID!
  questionId: Bytes!
  marketQuestionIds: [String!]!
  index: Int!
  arbitrator: Bytes!
  opening_ts: BigInt!
  timeout: BigInt!
  finalize_ts: BigInt!
  is_pending_arbitration: Boolean!
  best_answer: Bytes!
  bond: BigInt!
  min_bond: BigInt!
  arbitration_occurred: Boolean!
  marketQuestions: [MarketQuestion!]! @derivedFrom(field: "question")
  baseQuestions: [MarketQuestion!]! @derivedFrom(field: "baseQuestion")
}

type MarketQuestion {
  id: ID!
  market: Market!
  baseQuestion: Question!
  question: Question!
  index: Int!
}

type Condition {
  id: ID!
  conditionId: Bytes!
  marketIds: [String!]!
  markets: [Market!]! @derivedFrom(field: "ctfCondition")
}

type ConditionalEvent {
  id: ID!
  chainId: BigInt!
  market: Market!
  accountId: Bytes!
  eventType: String!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  collateral: Bytes!
  transactionHash: Bytes!
}

type CurateMetadata {
  id: ID!
  registrationMetaEvidenceURI: String!
  clearingMetaEvidenceURI: String!
  metaEvidenceCount: BigInt!
}

type ArbitratorMetadata {
  id: ID!
  registrationMetaEvidenceURI: String!
}

type Token {
  id: ID! # Token contract address
  transfers: [Transfer!]! @derivedFrom(field: "token")
}

type Transfer {
  id: ID! # Transaction hash + log index (prefixed by chainId)
  chainId: BigInt!
  token: Token!
  from: Bytes! # Address
  to: Bytes! # Address
  value: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  transactionFrom: Bytes! # tx.origin / transaction.from
  logIndex: BigInt!
}

enum OrderEventType {
  PLACE
  FILL
  CANCEL
  WITHDRAW
}

enum UserOrderStatus {
  OPEN
  FILLED
  WITHDRAWN
  CANCELLED
}

type LimitOrderPool {
  id: ID!
  chainId: BigInt!
  poolId: Bytes!
  currency0: Bytes!
  currency1: Bytes!
  fee: Int!
  tickSpacing: Int!
  hooks: Bytes!
  initialized: Boolean!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}

type OrderLevel {
  id: ID!
  chainId: BigInt!
  pool: LimitOrderPool!
  orderId: BigInt!
  tickLower: Int!
  zeroForOne: Boolean!
  liquidityTotal: BigInt!
  price0AtTick: BigDecimal!
  price1AtTick: BigDecimal!
  side: String!
  updatedAtBlock: BigInt!
  participants: [Bytes!]!
}

type UserOrder {
  id: ID!
  chainId: BigInt!
  orderId: BigInt! @index
  owner: Bytes! @index
  pool: LimitOrderPool!
  tickLower: Int!
  zeroForOne: Boolean!
  liquidity: BigInt!
  status: UserOrderStatus!
  placedAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type OrderEvent {
  id: ID!
  chainId: BigInt!
  type: OrderEventType!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  owner: Bytes
  orderId: BigInt! @index
  pool: LimitOrderPool!
  tickLower: Int
  zeroForOne: Boolean
  liquidity: BigInt
}
